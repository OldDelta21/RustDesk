name: Windows Build (Persian RTL client)

# Standalone Windows build for the rebranded, Persian/RTL client. GitHub-hosted
# windows-latest runners can build the Windows target, unlike this repo's Debian
# dev container. This mirrors the real steps build.py / the upstream CI use
# (see .github/workflows/flutter-build.yml + bridge.yml), simplified to a single
# x64 job so it works as a standalone file without the reusable-workflow split
# upstream uses for its multi-arch, signed release pipeline.

on:
  push:
  workflow_dispatch:

env:
  RUST_VERSION: "1.75"
  FLUTTER_VERSION: "3.24.5"
  LLVM_VERSION: "15.0.6"
  VCPKG_COMMIT_ID: "120deac3062162151622ca4860575a33844ba10b"
  CARGO_EXPAND_VERSION: "1.0.95"
  FLUTTER_RUST_BRIDGE_VERSION: "1.80.1"
  VERSION: "1.4.9"

jobs:
  build-windows:
    name: Build Windows client (x86_64)
    runs-on: windows-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # --- Native toolchain: LLVM/Clang + vcpkg (C++ deps: ffmpeg, libyuv, opus, ...) ---
      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}

      - name: Install vcpkg dependencies
        shell: bash
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        run: |
          "$VCPKG_ROOT/vcpkg" install \
            --triplet x64-windows-static \
            --x-install-root="$VCPKG_ROOT/installed"

      # --- Rust toolchain ---
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: rustfmt

      - uses: Swatinem/rust-cache@v2

      # --- Flutter SDK ---
      - name: Install Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64

      # --- flutter_rust_bridge codegen (generated_bridge.dart etc. are gitignored,
      #     the FFI glue between src/flutter_ffi.rs and the Flutter UI must be
      #     regenerated on every build) ---
      - name: Install flutter_rust_bridge_codegen
        shell: bash
        run: |
          cargo install cargo-expand --version ${{ env.CARGO_EXPAND_VERSION }} --locked
          cargo install flutter_rust_bridge_codegen --version ${{ env.FLUTTER_RUST_BRIDGE_VERSION }} --features "uuid" --locked

      - name: Run flutter_rust_bridge_codegen
        shell: bash
        run: |
          flutter_rust_bridge_codegen \
            --rust-input ./src/flutter_ffi.rs \
            --dart-output ./flutter/lib/generated_bridge.dart \
            --c-output ./flutter/macos/Runner/bridge_generated.h

      - name: flutter pub get
        shell: bash
        run: |
          cd flutter
          flutter pub get

      # --- Build the Rust core (librustdesk.dll) and the Flutter Windows client.
      #     build.py wraps: cargo build --lib --release (+ the virtual-display
      #     dylib), then runs `flutter build windows --release` from ./flutter,
      #     which is the actual command that produces the Release runner folder. ---
      - name: Build Windows client (cargo + flutter build windows --release)
        shell: bash
        run: |
          python3 build.py --flutter --hwcodec --skip-portable-pack

      - name: Locate build output
        id: dist
        shell: pwsh
        run: |
          $dist = "flutter/build/windows/x64/runner/Release"
          if (-not (Test-Path "$dist/rustdesk.exe")) {
            Write-Error "rustdesk.exe not found in $dist"
            exit 1
          }
          echo "dist=$dist" >> $env:GITHUB_OUTPUT

      - name: Package build output as .zip
        shell: pwsh
        run: |
          Compress-Archive -Path "${{ steps.dist.outputs.dist }}\*" -DestinationPath "rustdesk-windows-${{ env.VERSION }}.zip"

      - name: Upload .exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-windows-exe
          path: ${{ steps.dist.outputs.dist }}/rustdesk.exe

      - name: Upload .zip artifact (full Release folder)
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-windows-zip
          path: rustdesk-windows-${{ env.VERSION }}.zip
